commands:
  - id: validate-repository-scope
    command: python scripts/validate_repository.py
    purpose: Reject tracked paths outside the explicit project allowlist, case collisions, model weights, and media files.
  - id: compile-project-python
    command: python -m py_compile build_auto_s2v_workflow.py build_auto_s2v_windowed_workflow.py custom_nodes/comfyui_audio_duration_plan/__init__.py custom_nodes/comfyui_audio_duration_plan/motion_poster_nodes.py custom_nodes/comfyui_audio_duration_plan/local_visualizer_nodes.py scripts/validate_repository.py scripts/build_motion_loop_workflow.py scripts/build_guided_motion_poster_workflow.py scripts/build_guided_motion_poster_visualizer_workflow.py scripts/build_local_music_visualizer_workflow.py scripts/build_generic_music_visualizer_workflow.py scripts/build_infra_choir_visualizer_workflow.py scripts/build_infra_choir_enhanced_workflow.py scripts/build_infra_choir_wan_atmosphere_candidate.py scripts/build_infra_choir_raise_neon_black_candidate.py scripts/build_infra_choir_raise_neon_black_cloud_test.py scripts/build_atmospheric_motion_boost_preview.py scripts/build_infra_choir_raise_neon_black_full_video.py scripts/render_infra_choir_raise_neon_black_full_video.py scripts/benchmark_infra_choir_enhanced.py scripts/test_infra_choir_enhanced.py scripts/test_infra_choir_dual_track.py scripts/install_visualizer_semantic_assets.py scripts/motion_poster_manifest.py scripts/render_motion_poster.py
    purpose: Compile project-owned Python without executing ComfyUI generation.
  - id: build-motion-loop-workflow
    command: python scripts/build_motion_loop_workflow.py
    purpose: Regenerate the curated native 832x480 motion-loop workflow and validate its serialized links.
  - id: build-guided-motion-poster-workflow
    command: python scripts/build_guided_motion_poster_workflow.py
    purpose: Regenerate the primary 1024x576 one-queue guided GUI workflow and validate its serialized links.
  - id: build-guided-motion-poster-visualizer-workflow
    command: python scripts/build_guided_motion_poster_visualizer_workflow.py
    purpose: Regenerate the experimental guided copy with an audio-reactive lower-right brand logo.
  - id: build-local-music-visualizer-workflow
    command: python scripts/build_local_music_visualizer_workflow.py
    purpose: Regenerate and structurally validate the standalone procedural regional-compositing workflow.
  - id: build-generic-music-visualizer-workflow
    command: python scripts/build_generic_music_visualizer_workflow.py
    purpose: Regenerate and structurally validate the semantic next-pass copy without altering the fixed model-free target-stack workflow.
  - id: build-infra-choir-visualizer-workflow
    command: python scripts/build_infra_choir_visualizer_workflow.py
    purpose: Regenerate and structurally validate the production-polish seven-lane hybrid visualizer without modifying the existing hybrid or its three reference workflows.
  - id: build-infra-choir-enhanced-workflow
    command: python scripts/build_infra_choir_enhanced_workflow.py
    purpose: Rebuild the enhanced production copy from the unchanged Infra Choir production workflow and validate its shifted target links.
  - id: build-infra-choir-wan-atmosphere-candidate
    command: python scripts/build_infra_choir_wan_atmosphere_candidate.py
    purpose: Rebuild the separate one-candidate Wan atmosphere review workflow without touching the dual-track scaffold.
  - id: build-infra-choir-raise-neon-black-candidate
    command: python scripts/build_infra_choir_raise_neon_black_candidate.py
    purpose: Rebuild the separate Raise the Neon Black environmental-motion candidate with its AAC-safe 48 kHz working audio path.
  - id: build-infra-choir-raise-neon-black-cloud-test
    command: python scripts/build_infra_choir_raise_neon_black_cloud_test.py
    purpose: Rebuild the separate failed-dimension Wan cloud/smoke experiment for audit without modifying the accepted candidate or dual-track scaffold.
  - id: build-infra-choir-raise-neon-black-full-video
    command: .venv\Scripts\python.exe scripts/build_infra_choir_raise_neon_black_full_video.py
    purpose: Rebuild the separate full-song cached-motion workflow, source-derived lighting mask, and API prompt without modifying the dual-track scaffold.
  - id: test-infra-choir-enhanced
    command: .venv\Scripts\python.exe scripts/test_infra_choir_enhanced.py
    purpose: Validate cached high-resolution analysis, transient/envelope shaping, section overrides, and bounded EQ drawing without rendering media.
  - id: test-infra-choir-dual-track
    command: .venv\Scripts\python.exe scripts/test_infra_choir_dual_track.py
    purpose: Validate dual-track workflow schemas, reviewed manifest persistence, image fingerprints, deterministic target merging, and genuine 1024/2048-band analysis.
  - id: validate-motion-poster-manifest
    command: python scripts/render_motion_poster.py assets/motion-poster.example.json --check-manifest
    purpose: Validate the example manifest structure without requiring runtime media or rendering.
  - id: list-wan-model-assets
    command: powershell -ExecutionPolicy Bypass -File scripts/install-wan-s2v-assets.ps1 -ComfyRoot . -ListOnly
    purpose: Validate the model manifest and destination mapping without downloading model files.
  - id: list-visualizer-semantic-assets
    command: python scripts/install_visualizer_semantic_assets.py --comfy-root . --list-only
    purpose: Validate the optional pinned CLIPSeg destination and file set without downloading model files.
  - id: generate-source-catalog
    command: python refs/tools/generate_source_catalog.py
    purpose: Regenerate the committed sharded source catalog after source files change.
  - id: check-source-catalog
    command: python refs/tools/generate_source_catalog.py --check
    purpose: Verify the committed source catalog exactly matches tracked and untracked implementation source.
  - id: generate-okf-indexes
    command: python refs/tools/generate_okf_indexes.py
    purpose: Regenerate committed OKF discovery indexes after refs files or concept metadata change.
  - id: check-okf-indexes
    command: python refs/tools/generate_okf_indexes.py --check
    purpose: Verify committed OKF discovery indexes exactly match deterministic generated output.
  - id: check-agent-context
    command: python refs/tools/generate_agent_context.py --check
    purpose: Verify source-catalog freshness plus deterministic bounded coding-agent re-entry context generation.
  - id: validate-refs-initialized
    command: python refs/tools/validate_refs.py --mode initialized
    purpose: Validate required project facts, schemas, indexes, and Agent Academy compatibility.
