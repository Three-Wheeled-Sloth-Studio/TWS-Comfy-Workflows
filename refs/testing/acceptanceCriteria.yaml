version: 1
schema: refs/schemas/schemaRegistry.yaml
updated: 2026-10-12
criteria:
  - id: infra-choir-production-polish
    status: accepted
    summary: User accepted the production workflow on 2026-10-12 after reviewing its editable generated or external faded-source title card, generated persistent upper-left band/song wordmark with external override, optional logo selector, bottom-only spectrum/waveform EQ, outline-confined glints, and bounded organic-mask expansion; repeat and 287.375-second H.264/AAC validation preserved the fixed far field and audio.
  - id: infra-choir-seven-lane-workflow
    status: accepted
    summary: A separately named workflow provides seven complete independent lanes, skips disabled/incomplete/unverified targets without rewiring, accepts fewer or more configured targets, exposes reusable version-1 target JSON, and streams exact-duration output with optional overlays.
  - id: infra-choir-static-frame-hybrid
    status: accepted
    summary: Every frame starts from the source; procedural and optional translation-stabilized generated motion remain inside verified masks, linked glow stays local, and decoded Bella QA showed 0.020 mean temporal delta outside conservative target areas versus 0.434 inside.
  - id: infra-choir-linked-light-roles
    status: accepted
    summary: Light source, received illumination, and reflection use independent verified masks and bounded luminance/glow/saturation/hue settings while targets sharing an envelope group receive the same selected audio drive and deterministic phase.
  - id: infra-choir-semantic-quality
    status: provisional
    summary: Bella validation produced non-empty candidates for hair, fabric, crop-first smoke, clouds, compact sun disk, atmospheric illumination, and river reflection, but coarse hair/fabric/reflection boundaries still require human verification or painted correction before production.
  - id: generic-verified-target-flow
    status: accepted
    summary: A target lane accepts an object-class query, exposes a search-area-outlined detection review that passes the proposal through without requiring an upload, automatically uses a painted mask after Mask Editor Save, clears that correction when the source-artwork fingerprint changes, and exposes Reset saved mask for same-source rediscovery; it uses verification as an inclusion toggle, retains optional external-mask add/subtract/replace modes, accepts an appearance description and explicit billow/sway/drift/still motion type, and independently controls on/off-beat flicker and on/off-beat masked motion before joining an arbitrary-length target stack; the semantic starter graph provides five complete lanes, and connected unverified or empty lanes are skipped without rewiring when another usable target exists.
  - id: optional-semantic-target-provider
    status: provisional
    summary: Detect Animation Target can use a pinned, local-only CLIPSeg snapshot for crop-first text-semantic heatmaps, constrain results by search area and sensitivity, expand unqualified smoke across neutral smoke colors inside a bounded crop, report confidence and the active provider, fall back deterministically when optional assets are absent, or fail explicitly in semantic-only mode; Bella Ciao evaluation improved hair and red-fabric proposals and found the intended pale smoke after crop-first refinement, but broad sun/flag selection keeps overall semantic quality provisional.
  - id: generic-masked-motion
    status: accepted
    summary: Explicit procedural motion profiles can visibly deform source pixels inside verified masks while every frame begins from the static source and pixels outside those masks remain protected; billow contracts its moving interior to protect mask boundaries and sway anchors mask bases.
  - id: local-composite-static-base
    status: accepted
    summary: The lightweight visualizer begins every frame from the unchanged source and applies no global camera transform; only explicit mask regions enter effect compositing.
  - id: independent-audio-mappings
    status: accepted
    summary: Clouds, candles, red lights, monitor, rain, and reflections use distinct slow-energy, beat, onset, high-band, or continuous-time mappings rather than pulsing together.
  - id: model-free-bounded-render
    status: accepted
    summary: The MVP loads no generative or segmentation model and streams frames through FFmpeg instead of retaining a several-minute video in RAM.
  - id: local-render-progress
    status: accepted
    summary: The V3 renderer reports native ComfyUI progress through audio analysis and per-frame generation.
  - id: local-postprocess-badging
    status: accepted
    summary: The local compositor can apply an upper-left transparent track wordmark with halo, a configurable cheap deterministic sparkle clipped to its alpha, and an independent lower-right studio badge after all regional animation.
  - id: guided-one-queue-operation
    status: accepted
    summary: A user can select the reference image and song, edit guidance, configure optional branding and delivery, and generate the complete output with one queue operation.
  - id: exact-audio-duration
    status: accepted
    summary: The assembler streams H.264/AAC output to the exact supplied audio duration without retaining the completed song as an in-memory frame batch.
  - id: conservative-motion-defaults
    status: accepted
    summary: One variant, neutral camera, editable preservation guidance, and anti-lip-sync prompting are the production defaults.
  - id: post-generation-branding
    status: accepted
    summary: Independent lower-right logo and upper-left wordmark overlays are composited after generation and delivery scaling.
  - id: exact-1080p-delivery
    status: accepted
    summary: Default delivery scales the accepted 1024x576 exact-16:9 generation to 1920x1080 without padding, stretching, or cropping; source resolution remains selectable for diagnostics.
  - id: known-limitations-documented
    status: accepted
    summary: Small or off-center face distortion, embedded-text damage, multi-variant blur, and optional future enhancements are documented and are not misrepresented as solved.
