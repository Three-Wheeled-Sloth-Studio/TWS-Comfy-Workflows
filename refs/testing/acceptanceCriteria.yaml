version: 1
schema: refs/schemas/schemaRegistry.yaml
updated: 2026-10-08
criteria:
  - id: generic-verified-target-flow
    status: accepted
    summary: A target lane accepts an object-class query, exposes a search-area-outlined detection review that passes the proposal through without requiring an upload and automatically uses a painted mask after Mask Editor Save, uses verification as an inclusion toggle, retains optional external-mask add/subtract/replace modes, accepts an appearance description and explicit billow/sway/drift/still motion type, and independently controls on/off-beat flicker and on/off-beat masked motion before joining an arbitrary-length target stack; connected unverified or empty lanes are skipped without rewiring when another usable target exists.
  - id: generic-masked-motion
    status: accepted
    summary: Explicit procedural motion profiles can visibly deform source pixels inside verified masks while every frame begins from the static source and pixels outside those masks remain protected; billow contracts its moving interior to protect mask boundaries and sway anchors mask bases.
  - id: local-composite-static-base
    status: accepted
    summary: The lightweight visualizer begins every frame from the unchanged source and applies no global camera transform; only explicit mask regions enter effect compositing.
  - id: independent-audio-mappings
    status: accepted
    summary: Clouds, candles, red lights, monitor, rain, and reflections use distinct slow-energy, beat, onset, high-band, or continuous-time mappings rather than pulsing together.
  - id: model-free-bounded-render
    status: accepted
    summary: The MVP loads no generative or segmentation model and streams frames through FFmpeg instead of retaining a several-minute video in RAM.
  - id: local-render-progress
    status: accepted
    summary: The V3 renderer reports native ComfyUI progress through audio analysis and per-frame generation.
  - id: local-postprocess-badging
    status: accepted
    summary: The local compositor can apply an upper-left transparent track wordmark with halo and an independent lower-right studio badge after all regional animation.
  - id: guided-one-queue-operation
    status: accepted
    summary: A user can select the reference image and song, edit guidance, configure optional branding and delivery, and generate the complete output with one queue operation.
  - id: exact-audio-duration
    status: accepted
    summary: The assembler streams H.264/AAC output to the exact supplied audio duration without retaining the completed song as an in-memory frame batch.
  - id: conservative-motion-defaults
    status: accepted
    summary: One variant, neutral camera, editable preservation guidance, and anti-lip-sync prompting are the production defaults.
  - id: post-generation-branding
    status: accepted
    summary: Independent lower-right logo and upper-left wordmark overlays are composited after generation and delivery scaling.
  - id: exact-1080p-delivery
    status: accepted
    summary: Default delivery scales the accepted 1024x576 exact-16:9 generation to 1920x1080 without padding, stretching, or cropping; source resolution remains selectable for diagnostics.
  - id: known-limitations-documented
    status: accepted
    summary: Small or off-center face distortion, embedded-text damage, multi-variant blur, and optional future enhancements are documented and are not misrepresented as solved.
