version: 1
schema: refs/schemas/schemaRegistry.yaml
updated: 2026-10-20
decisions:
  - id: next-video-vace-and-loop-quality-gate
    status: accepted
    date: 2026-10-20
    decision: Before the next full-song render, eliminate the visible loop jump, isolate the source of temporal fuzz, and evaluate Wan 2.1 VACE 1.3B in a separate short 832x480 fixed-seed benchmark.
    rationale: The corrected v2 compositor preserves motion and overlays, but visual review still finds a screen jump and fuzzing. Official VACE guidance positions the 1.3B model around 81-frame 480p output, which is a plausible lower-cost controlled-motion candidate but remains unproven on the local 12 GB system.
    consequences:
      - Do not infer the next image, song, regions, or prompts from Raise the Neon Black; bind the benchmark to the next user-selected inputs.
      - Measure every loop boundary and protected static region; aggregate motion alone is not an acceptance gate.
      - Preserve lossless or near-lossless intermediates so model instability can be separated from seam blending, scaling, and encode artifacts.
      - Do not download VACE weights or run a full song until the user initiates the benchmark and the short candidate passes.
  - id: raise-neon-black-cached-motion-full-song
    status: accepted
    date: 2026-10-20
    decision: Use the reviewed short Wan asset as a cached full-frame motion lane, amplify its existing atmosphere temporally without spatial warping, and add title, ultra-band EQ, and localized light response in the deterministic full-song renderer.
    rationale: The accepted clip preserves character and composition while a nominally cheap 640x360 Wan gate consumed 95 minutes before failing on incompatible latent dimensions; deterministic reuse completed the 208-second production render safely in 28 minutes.
    consequences:
      - Keep short Wan generation and full-song assembly as separate stages.
      - Do not assume reduced Wan resolution or frame count is an inexpensive prompt-discovery path on the current 12 GB/offload setup.
      - Derive per-song lighting masks from the current source artwork and keep them separate from prior-song masks and configuration.
      - Preserve the dual-track scaffold; song-specific full renders use separately versioned workflows.
  - id: infra-choir-modal-manual-target-settings
    status: accepted
    date: 2026-10-15
    decision: Keep common manual-target controls on compact graph cards and edit infrequent per-target controls through a modal Advanced Settings editor backed by one hidden serialized field.
    rationale: Full enhanced target cards are too tall to associate visually with their detector lanes, while separate settings nodes add graph wiring and alignment burden.
    consequences:
      - The modal exposes audio drivers, response envelopes, grouping, detailed glow and shimmer, and cached atmospheric clip controls without adding graph nodes or links.
      - Detector-side inclusion remains the single render inclusion control.
      - The root workflow is authoritative user state and must not be regenerated from an image- or song-specific baseline; no TWS/Video duplicate should be created.
      - Role-specific filtering must not present generated-clip blend, shimmer, glow, lighting, or motion controls on cards where the renderer cannot consume them.
      - Visible smoke and lighting controls must retain perceptible transfer after soft-mask compositing while respecting explicit luminance, glow, and source-motion safety bounds.
  - id: infra-choir-reviewed-dual-track-targets
    status: accepted
    date: 2026-10-14
    decision: Merge reviewed image-bound auto targets with the manual stack.
    rationale: Discovery can accelerate new-image setup, but masks and semantic labels are not trustworthy enough to enter a full-song render without image binding and human approval; the proven manual lanes must remain the overriding rollback path.
    consequences:
      - Discovery defaults to idle and does not perform analysis during ordinary rendering.
      - Only approved, edited, or locked targets with matching source fingerprints deserialize into runtime targets.
        - Manual-only, auto-only, keep-both, manual-wins, and auto-wins policies are explicit; the discovery scaffold defaults to auto-only so image-specific legacy lanes cannot silently reinterpret a new source image.
      - Optional atmosphere clips are prepared offline and never cause diffusion to run inside the full-song renderer.
      - Desktop import and full-song visual QA are required before the candidate can be called production-ready.
  - id: infra-choir-enhanced-streaming-analysis
    status: accepted
    date: 2026-10-13
    decision: Add the Fill-Nodes-informed audio, envelope, masked-effect, and genuine high-resolution spectrum capabilities as project-owned streaming extensions in a separately named enhanced production workflow.
    rationale: Fill-Nodes provides useful Apache-2.0 signal and effect concepts, but its FL_AUDIO_ENVELOPE types and full-image-batch effect nodes are incompatible with the existing target JSON and full-song bounded-memory architecture.
    consequences:
      - The existing production workflow and original node registrations remain backward compatible and unchanged as the A/B baseline.
      - One cacheable STFT pass supplies all target, lighting, reflection, title, effect, and EQ signals on a common output-frame timebase.
      - Enhancements are independently switchable, and disabling the master enhancement control reproduces the baseline decoded output.
      - Source separation remains optional and absent; vocal and instrument controls are explicitly documented spectral proxies.
      - The renderer remains CPU/NumPy plus FFmpeg and does not require cloud services, generative models, or CPU model offloading.
  - id: infra-choir-deterministic-production-overlays
    status: accepted
    date: 2026-10-12
    decision: Add deterministic title-card and persistent wordmark generation, a bottom EQ, title-outline glints, optional logo selection, and bounded organic-mask expansion in a separate production copy of the fixed-frame hybrid workflow.
    rationale: The visual identity needs repeatable titling and restrained music response without new models, required files, graph rewiring, or changes to the proven target and lighting architecture.
    consequences:
      - Generated text is the no-file default for both the faded-source opening card and persistent upper-left band/song wordmark; external inputs remain overrides.
      - The EQ reuses frequency bands retained by the existing single audio-analysis pass.
      - Sparkles are clipped to generated stroke masks or conservatively detected external pale outlines and otherwise skip with a diagnostic.
      - Stationary overlays are independently optional and cannot introduce camera motion; organic expansion is explicitly bounded and leaves the far field static.
      - A direct input-folder selector closes the optional lower-right logo-selection gap without removing the connected image/mask override.
      - Georgia remains a documented local dependency with DejaVu Serif and Pillow fallbacks; no font asset is redistributed.
  - id: infra-choir-fixed-frame-hybrid
    status: accepted
    date: 2026-10-09
    decision: Add a new seven-lane fixed-frame workflow that combines reviewed semantic masks, procedural motion, optional stabilized short generated-motion batches, and explicit linked light-source, illumination, and reflection roles.
    rationale: The existing target stack already provides safe mask review and bounded streaming, but it cannot distinguish lighting roles or consume generated organic pixels without risking whole-frame motion.
    consequences:
      - The local, generic, and semantic workflows remain unchanged references; the hybrid is a separately named workflow and builder.
      - Every output frame begins from the source, generated frames are translation-stabilized and mask-clipped, and global camera/exposure motion is absent.
      - Automatic candidates remain unverified by default; incorrect detection cannot silently render.
      - Target behavior is exportable as version-1 JSON while masks and generated IMAGE batches remain typed workflow connections.
      - Interrupted FFmpeg output is isolated in a replaceable partial and promoted atomically after success.
  - id: generic-verified-animation-target-stack
    status: accepted
    date: 2026-10-07
    decision: Fork the fixed six-slot compositor into a repeatable animation-target stack with detection preview, explicit mask verification, explicit procedural motion profiles, and independent beat/off-beat controls for flicker and masked motion.
    rationale: Alternate artwork with similar composition transferred well, but a production workflow must describe targets and motion rather than encode one image's six named sockets; detection errors must remain visible and user-correctable.
    consequences:
      - The accepted V3 workflow remains intact as a tuned reference while the generic workflow is validated independently.
      - Any number of target lanes can be chained without changing the renderer schema.
      - The model-free detector is a proposal generator, not semantic segmentation; unverified masks cannot render and ordinary ComfyUI masks can replace it.
      - Optional pinned local CLIPSeg work lives in `music_visualizer_target_builder_semantic.json` with its own semantic detector node type; it never downloads during workflow execution, while the original workflow and detector remain fixed and model-free.
      - Each review node passes detection through by default; Mask Editor Save persists and selects a lane-specific, source-fingerprint-bound correction without a separate loader or upload step, and source changes clear stale corrections.
      - Same-source rediscovery uses a visible Reset saved mask control; five complete lanes are the curated UI maximum, and unused unverified lanes are skipped.
      - Appearance keywords and explicit billow, sway, drift, or still motion profiles preserve pixels outside verified masks and independently combine beat/non-beat flicker with bounded masked deformation.
  - id: standalone-local-composite-visualizer
    status: accepted
    date: 2026-10-07
    decision: Prototype the new music visualizer as a standalone CPU procedural compositor with explicit independent masks, per-target audio mappings, a static full-frame base, and streamed FFmpeg output.
    rationale: The required motion is local and atmospheric; regenerating the complete image with a 14B video model wastes VRAM, destabilizes protected objects, and makes target discovery seed-dependent.
    consequences:
      - The MVP does not load Wan, LTX, SAM, or any other model.
      - Geometric and color-refined masks remain inspectable and replaceable with ordinary ComfyUI masks.
      - Camera motion and multi-variant blending are absent by design.
      - Optional automatic segmentation or regional generation may be evaluated later without becoming a default dependency.
  - id: defer-logo-spectrum-from-production
    status: accepted
    date: 2026-10-02
    decision: Preserve the stereo radial-spectrum workflow as an experiment, but keep the static lower-right logo in the production workflow.
    rationale: The spectrum passed coherence testing and reacted correctly to note and strength, but drew too much attention to the lower-right corner.
    consequences:
      - The primary guided workflow remains the production recommendation.
      - Future visualizer work should reduce footprint, contrast, or opacity before reconsidering promotion.
      - The existing experimental workflow stays installable for reference and iteration.
  - id: targeted-motion-and-generated-title-halo
    status: accepted
    date: 2026-10-02
    decision: Add explicit per-image motion targets and stronger anti-invention prompting for Wan, and derive an optional dark or light title halo deterministically from the wordmark alpha channel during FFmpeg assembly.
    rationale: Wan does not reliably discover smoke, local light sources, or background appendages in dense artwork and may invent face-like content; the title treatment should remain outside generative video so it stays sharp and predictable.
    consequences:
      - Users should name exact existing regions and physical motion in the motion-targets field instead of relying on general scene interpretation.
      - Prompting reduces but cannot eliminate invented faces; failed seeds still require rejection until regional masking exists.
      - The halo costs no diffusion time and cannot be deformed by Wan.
      - Optional 1080p fill delivery removes side bands with a documented small center crop; no-crop 1080p remains the default.
  - id: lanczos-1080p-delivery-default
    status: accepted
    date: 2026-10-01
    decision: Default the guided assembler to deterministic FFmpeg Lanczos delivery at 1920x1080, scaling the complete exact-16:9 1024x576 foreground before applying branding.
    rationale: This closes the YouTube delivery path without model downloads, temporal shimmer, foreground crop, or aspect-ratio stretching; optional AI enhancement can be evaluated separately.
    consequences:
      - Source resolution remains available in the GUI for diagnostics.
      - Branding is sized and composited after delivery scaling.
      - No AI upscale model is currently a production dependency.
  - id: single-variant-motion-poster-default
    status: accepted
    date: 2026-10-01
    decision: Keep one generated variant as the quality default until multi-variant transitions avoid blended blur and preserve lighting flicker.
    rationale: A real three-variant run completed within time, GPU, and thermal tolerances but looked like layered variants and smoothed away the useful lighting motion.
    consequences:
      - Performance is not the blocker for multi-variant work; transition quality is.
      - Future experiments should prefer short transitions, low-motion cuts, or section-level alternation over sustained crossfades.
      - The guided workflow continues to expose up to three variants for experiments but defaults to one.
  - id: embedded-deny-by-default-worktree
    status: accepted
    date: 2026-10-01
    decision: Keep the Git worktree at the live ComfyUI data root with a deny-by-default ignore file and independent tracked-path validation.
    rationale: Runtime paths remain direct and there is no duplicate source tree, while models, media, outputs, general user state, and third-party nodes are excluded aggressively.
    consequences:
      - Every new tracked root path must be explicitly allowlisted in both .gitignore and scripts/validate_repository.py.
      - Force-added files are still rejected by validation and CI.
  - id: cpu-windowed-continuation
    status: accepted
    date: 2026-09-30
    decision: Store completed latent chunks in CPU memory and pass only Wan's latest 19 latent frames as continuation motion context.
    rationale: Core Wan conditioning already truncates reference motion latent to 19 frames; retaining progressively concatenated GPU latents is unnecessary.
    consequences:
      - Final latent concatenation occurs once after the loop.
      - Native loop execution state may still retain other per-iteration GPU/runtime objects and remains under investigation.
  - id: cached-reference-conditioning
    status: accepted
    date: 2026-10-01
    decision: Extract and reuse reference-image latent conditioning from the initial Wan pass.
    rationale: Re-encoding an unchanged image forced VAE and diffusion-model swapping on every extension.
    consequences:
      - The VAE prepares only for the initial conditioning and final decode.
      - Reference-image changes require a new initial pass.
  - id: generate-low-res-upscale-later
    status: accepted
    date: 2026-09-30
    decision: Generate the guided production asset at 1024x576 exact 16:9 and upscale as post-processing.
    rationale: A real 1024x576 guided run completed within the user's acceptable time and memory envelope, looked good, and produced a smaller final MP4; native 720p and 1080p diffusion remain outside practical margins on the current machine.
    consequences:
      - Delivery-quality evaluation must include temporal stability of the upscaler.
  - id: hybrid-motion-poster-production-path
    status: accepted
    date: 2026-10-01
    decision: Use ComfyUI to prepare short motion assets, masks, and depth data, then assemble full-song videos with a deterministic manifest-driven Python/FFmpeg renderer.
    rationale: The required result is restrained, semantically appropriate motion rather than continuously novel generated footage; deterministic assembly avoids progressive Wan slowdown, cumulative drift, and late-run OOM risk.
    consequences:
      - Full-song native Wan continuation remains an experimental option rather than a production prerequisite.
      - Final rendering should stream to disk with bounded memory and exact audio duration.
      - Beat response must be subtle and limited to explicitly appropriate camera or masked effects.
      - Timed lyric files may be composited as an optional final-render feature.
  - id: native-guided-motion-loop-assets
    status: accepted
    date: 2026-10-01
    decision: Generate guided production motion assets natively at 1024x576 from the primary reference image, song audio, explicit motion guidance, and conservative anti-lip-sync negative prompts.
    rationale: Reframing a square clip damages composition, while unconstrained S2V can invent conspicuous mouth motion that does not match the song.
    consequences:
      - The assembler rejects loop aspect ratios outside the configured tolerance instead of cropping or stretching them.
      - Background-only motion is the safe default; singing or lip sync must be explicitly requested and validated.
      - Multiple independently seeded loop variants may be crossfaded for variety after identity and composition review.
  - id: guided-comfyui-workflow-primary-interface
    status: accepted
    date: 2026-10-01
    decision: Make one guided ComfyUI graph the primary motion-poster interface; retain manifests and CLI scripts as reproducibility and diagnostic tools.
    rationale: Ordinary users should select media, describe motion, choose variant count, and queue once rather than coordinate intermediate files and commands.
    consequences:
      - Custom nodes build safe prompts, fan out deterministic seeds, and assemble the full-song output inside the graph.
      - Updating the project-owned custom node requires one Comfy Desktop restart before the guided workflow can run.
      - The final GUI assembly remains bounded-memory at the FFmpeg stage, while generated frame batches consume system RAM until assembly begins.
