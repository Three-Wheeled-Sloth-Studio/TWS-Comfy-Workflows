todos:
  - id: evaluate-wan21-vace-13b-motion-loop
    status: done
    area: generation-fidelity
    summary: The installed VACE 1.3B gate produced real environmental motion but required 45 minutes 31 seconds for 17 frames at 832x480, making it impractical here. A subsequent native Wan 2.2 TI2V 5B benchmark completed 77 frames at 1024x576/20 steps in 129.84 seconds and is the preferred candidate.
  - id: integrate-wan22-ti2v-5b-generic-workflow
    status: done
    area: generation-fidelity
    summary: "User review accepted the generic TI2V 5B workflow as production-workable: reasonable runtime, responsive workstation, highly dynamic cloud/smoke/fog, and appropriate music-synchronized lighting. Wave motion was somewhat aggressive but prompt-tunable. The persisted 77-frame lane, overlap loop, and downstream compositor are validated for continued use."
  - id: improve-eq-color-controls
    status: deferred
    area: user-interface
    summary: Place the two EQ color controls together and expose color pickers for both. Explore a Suggest colors action that selects two mutually distinct colors with strong contrast against the bottom EQ region while favoring hues complementary to colors elsewhere in the current artwork.
  - id: benchmark-longer-ti2v5b-motion-assets
    status: in_progress
    area: generation-fidelity
    summary: The separate 121-frame gate completed in 233.98 seconds, scaling to 1.69x the prior wall time for 1.57x the frames. It produced a stable 7.56-second asset and a 6.75-second overlap-aware loop whose boundary was at ordinary-motion 95th-percentile scale. Await user review before promotion, then instrument generation, decode/persistence, lighting/compositing, and encoding separately before considering 161 frames or more steps.
  - id: validate-infra-choir-dual-track-runtime
    status: in_progress
    area: lightweight-visualizer
    summary: Recovery preserved live workflows and verified the scaffold hash, current masks/merge settings, generated clips, title/EQ, and a real-media probe. Treat audited media as historical, re-read the user-designated workflow, and run builders only in isolation.
  - id: benchmark-offline-wan-atmosphere-clips
    status: done
    area: generation-fidelity
    summary: The user-selected Raise the Neon Black image/audio completed one accepted 1024x576 motion test and a corrected 208.25-second 1080p hybrid render with protected temporal atmosphere amplification, localized music-synced lighting, title/wordmark, 2048-band EQ, and 48 kHz AAC. The compact target adapter now preserves cached-motion settings, and five checkpoints verify motion throughout the v2 delivery. The nominal 640x360 cheap Wan gate failed after 95 minutes on incompatible latent dimensions, so future cheap review uses cached/procedural previews instead of reduced Wan inference.
  - id: add-infra-choir-enhanced-visualizer
