roadmap:
  - id: stabilize-long-wan-s2v
    horizon: later
    status: deferred
    summary: Eliminate progressive GPU pressure and complete full-song 832x480 Wan 2.2 S2V runs reliably on 12 GB VRAM.
  - id: hybrid-motion-poster
    horizon: now
    status: in_progress
    summary: Produce exact-duration music videos by combining short Comfy-generated motion assets with deterministic, semantically masked, bounded-memory rendering.
  - id: durable-chunk-checkpoints
    horizon: next
    status: planned
    summary: Persist completed chunks or latent checkpoints so interrupted overnight runs can resume without losing prior work.
  - id: streaming-assembly
    horizon: next
    status: complete
    summary: Stream hybrid-rendered frames or segments to disk without retaining the full decoded song in memory.
  - id: youtube-upscale
    horizon: later
    status: planned
    summary: Establish a temporally stable post-processing path from 832x480 generation to 720p or 1080p 16:9 delivery.
  - id: beat-aware-effects
    horizon: later
    status: planned
    summary: Add optional beat-derived control for restrained glow and lighting accents without driving lips, faces, or whole-image motion from audio amplitude.
