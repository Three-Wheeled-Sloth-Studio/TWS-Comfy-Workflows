version: 1
schema: refs/schemas/schemaRegistry.yaml
updated: 2026-10-01
areas:
  continuation-nodes:
    guidance:
      - Inspect state ownership and tensor device placement before changing loop behavior.
      - Preserve Wan's 19-latent-frame reference-motion behavior unless runtime evidence justifies a change.
    source_roots:
      - custom_nodes/comfyui_audio_duration_plan/__init__.py
    notes: Contains audio-duration planning, CPU continuation state, cached reference conditioning, and final latent assembly.
  workflow-builders:
    guidance:
      - Regenerate and structurally validate serialized links after builder changes.
      - The windowed builder consumes the auto-duration workflow generated by the first builder.
    source_roots:
      - build_auto_s2v_workflow.py
      - build_auto_s2v_windowed_workflow.py
    notes: Generates derived ComfyUI workflow JSON while preserving the source workflow.
  workflows:
    guidance:
      - Treat the windowed workflow as experimental until it completes beyond iteration 21 and final decode.
    source_roots:
      - user/default/workflows/video_wan2_2_14B_s2v.json
      - user/default/workflows/video_wan2_2_14B_s2v_auto_duration.json
      - user/default/workflows/video_wan2_2_14B_s2v_auto_duration_windowed.json
    notes: Saved ComfyUI graphs; only these explicitly allowlisted user files are tracked.
  setup-and-validation:
    guidance:
      - Never download models during ordinary validation.
      - Use ListOnly or WhatIf modes when testing installers.
    source_roots:
      - scripts
      - assets/wan-s2v-models.json
    notes: Installs project files, declares model dependencies, downloads optional assets, and enforces repository scope.
